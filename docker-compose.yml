services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic orders_raw --bootstrap-server kafka:19092 --partitions 3 --replication-factor 1

  spark:
    image: apache/spark:3.5.1-python3
    container_name: spark
    user: root
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /work
    volumes:
      - ./:/work
      - ivy-cache:/tmp/.ivy
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_SERVERS: kafka:19092
    command: >
      /opt/spark/bin/spark-submit --driver-memory 2g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,io.delta:delta-spark_2.12:3.2.0
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.jars.ivy=/tmp/.ivy
      streaming/stream_pipeline.py

  generator:
    image: python:3.13-slim
    container_name: generator
    working_dir: /work
    volumes:
      - ./:/work
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    profiles: ["gen"]
    command: >
      bash -c "pip install --quiet numpy pandas orjson kafka-python-ng &&
      python streaming/generator.py --servers kafka:19092 --rate 1.67 --batch 1 --limit 0"

  scorer:
    image: python:3.13-slim
    container_name: scorer
    working_dir: /work
    volumes:
      - ./:/work
    depends_on:
      - spark
    command: >
      bash -c "pip install --quiet scikit-learn==1.6.1 pandas numpy joblib 'deltalake[pyarrow]' &&
      python -u streaming/score_stream.py"

  dashboard:
    image: python:3.13-slim
    container_name: dashboard
    working_dir: /work
    ports:
      - "8501:8501"
    volumes:
      - ./:/work
    command: >
      bash -c "pip install --quiet streamlit pandas 'deltalake[pyarrow]' &&
      streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"

volumes:
  ivy-cache:
